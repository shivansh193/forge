name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://forge:forge@localhost:5432/forge"
      DIRECT_URL: "postgresql://forge:forge@localhost:5432/forge"
      # Not real Neon Auth credentials — lib/auth/server.ts validates these
      # at module load, so build/test/lint fail without *some* value. CI
      # never makes an actual auth network call, so a placeholder is enough.
      NEON_AUTH_BASE_URL: "https://ci-placeholder.invalid/auth"
      NEON_AUTH_COOKIE_SECRET: "ci-placeholder-secret-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm run lint
